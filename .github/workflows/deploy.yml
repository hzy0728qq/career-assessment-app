name: CI & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: false
        default: 'production'
        type: choice
        options: [production, preview]

# 部署 GitHub Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支/PR 并发取消旧任务
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========= 构建 =========
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  # ========= 部署 GitHub Pages (仅 main 分支 push 或 manual) =========
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-20
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}

  # ========= 发布 GitHub Release 静态包(可选,打 tag 时执行) =========
  release:
    name: Release static package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-20
          path: dist

      - name: Package
        run: cd dist && zip -r ../career-assessment-app-${{ github.ref_name }}.zip . && cd ..

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: career-assessment-app-*.zip
          generate_release_notes: true
